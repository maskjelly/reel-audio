[project]
name = "reel-audio"
version = "0.1.0"
description = "Get the song name from an Instagram reel and download the song or the reel's audio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["yt-dlp[default,curl-cffi]>=2026.10.26"]

[project.scripts]
reel-audio = "reel_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_audio"]
